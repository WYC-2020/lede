name: Build ToolChain

on:
   schedule:
      - cron: 0 8 * * THU
   release:
      types: [published]
   repository_dispatch:
   workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: git@github.com:WYC-2020/lede.git
  REPO_BRANCH: master
  CONFIG_FILE: config_x86
  TZ: Asia/Shanghai
  
jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Set ssh agent
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq install libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        
    - name: cache
      uses: WYC-2020/cachewrtbuild@main
      with:
        ccache: 'true'
        only_toolchain: 'true'
        prefix: ${{ github.workspace }}

    - name: Update feeds
      run:  ./scripts/feeds update -a

    - name: Install feeds
      run:  ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files ./files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE ./.config
 
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
   
    - name: Compile the toolchain
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make toolchain/compile -j$(nproc) V=s || make toolchain/compile -j1 V=s 
        echo "status=success"  >> $GITHUB_OUTPUT
          
    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
        repo: ${{ secrets.UPLOAD_REPO_GITHUB }}
      env:
        GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
